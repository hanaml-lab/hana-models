[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "small-lm"
version = "0.6.0"
description = "Quantised small language models on phones and laptops, with local retrieval and a calibrated router."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
run = ["llama-cpp-python>=0.3", "sqlite-vec>=0.1"]
embed = ["sentence-transformers>=3.0"]
quantize = ["huggingface-hub>=0.25", "transformers>=4.51", "torch>=2.4"]

[project.scripts]
small-lm = "small_lm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["small_lm"]
