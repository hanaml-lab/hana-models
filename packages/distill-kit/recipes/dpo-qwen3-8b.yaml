# DPO on pairs built from the SFT student's own errors (distill-kit pairs).
stage: dpo
model: runs/sft
data: pairs.jsonl
output_dir: runs/dpo
deepspeed: recipes/ds_zero3.json
trainer:
  learning_rate: 5.0e-7
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  beta: 0.1
  loss_type: sigmoid
  max_length: 8192
  max_prompt_length: 6144
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  seed: 7
