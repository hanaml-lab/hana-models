# Full fine-tune of Qwen3-8B on the filtered, deduplicated teacher traces. 8 x 80 GB.
stage: sft
model: Qwen/Qwen3-8B
data: train.jsonl
schema: schemas/claim.json
output_dir: runs/sft
deepspeed: recipes/ds_zero3.json
trainer:
  learning_rate: 1.0e-5
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_length: 8192
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: epoch
  seed: 7
