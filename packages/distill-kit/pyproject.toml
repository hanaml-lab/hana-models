[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distill-kit"
version = "0.5.0"
description = "Data pipeline and training recipes for post-training a small open model on one domain task."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hanaML", email = "hello@hanaml.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.51", "trl>=0.17", "datasets>=3.0", "accelerate>=1.0", "deepspeed>=0.15", "peft>=0.13"]
serve = ["vllm>=0.8"]

[project.scripts]
distill-kit = "distill_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["distill_kit"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "distill_kit/templates"
