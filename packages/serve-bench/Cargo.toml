[workspace]
resolver = "2"
members = ["crates/replay", "crates/metrics"]

[workspace.package]
version = "0.7.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hanaml-lab/hana-models"
authors = ["hanaML <hello@hanaml.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
